<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Statement Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        #status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
            text-align: center;
            display: none;
        }
        
        #status.active {
            display: block;
            background: #e3f2fd;
            color: #1976d2;
        }
        
        #status.success {
            display: block;
            background: #e8f5e9;
            color: #388e3c;
        }
        
        #status.error {
            display: block;
            background: #ffebee;
            color: #d32f2f;
        }
        
        #summary {
            display: none;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        #summary.show {
            display: block;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .summary-row:last-child {
            border-bottom: none;
        }
        
        .summary-label {
            font-weight: 600;
            color: #555;
        }
        
        .summary-value {
            color: #333;
        }
        
        #downloadBtn {
            display: none;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            text-align: center;
            transition: transform 0.2s;
        }
        
        #downloadBtn:hover {
            transform: translateY(-2px);
        }
        
        #downloadBtn.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        .spinner.show {
            display: block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Bank Statement Analyzer</h1>
        <p class="subtitle">Upload your PDF bank statement for instant analysis</p>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📄</div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p style="color: #999; font-size: 0.9em; margin-top: 5px;">PDF files only</p>
        </div>
        
        <input type="file" id="fileInput" accept="application/pdf" />
        
        <div class="spinner" id="spinner"></div>
        
        <div id="status">Waiting for upload...</div>
        
        <div id="summary">
            <div class="summary-row">
                <span class="summary-label">Account:</span>
                <span class="summary-value" id="accountName">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Period:</span>
                <span class="summary-value" id="period">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Total Debit:</span>
                <span class="summary-value" id="totalDebit">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Total Credit:</span>
                <span class="summary-value" id="totalCredit">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Transactions:</span>
                <span class="summary-value" id="transactionCount">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Validation:</span>
                <span class="summary-value" id="validationStatus">-</span>
            </div>
        </div>
        
        <a id="downloadBtn" download>📥 Download Excel Report</a>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
