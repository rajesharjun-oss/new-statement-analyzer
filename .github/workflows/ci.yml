name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile backend and tests
        run: python -m compileall -q backend tests

      - name: Run backend tests
        run: |
          python tests/test_categorization_money.py
          python tests/test_uba_extraction_quality.py
          python tests/test_wema_engine.py
          python tests/test_zenith_engine.py
          python tests/regression/run_regression.py

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
